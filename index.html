  <script src="/_sdk/6e31def43ecdfeab.editing_sdk.js" integrity="sha512-dLsCmEXoPwwgpykZ4cBcMyQIrP+91IJR9KNOwXo5DW+WeKKF+Uo/SerDyq8ysa/BlG5uxbgAtmcz7kiob0VKYA=="></script>
  <script>
    const screens = {
      title: document.getElementById('title-screen'),
      sort: document.getElementById('sort-screen'),
      quiz: document.getElementById('quiz-screen'),
      reward: document.getElementById('reward-screen')
    };
    const items = [...document.querySelectorAll('.item-card')];
    const bins = [...document.querySelectorAll('.bin')];
    let currentItem = 0, score = 0, timeLeft = 45, timerId = null, selectedItem = null;

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[name].classList.add('active');
    }
    function feedback(id, message, type) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = 'feedback ' + type;
    }
    function showItem() {
      items.forEach(item => item.classList.remove('active', 'selected'));
      selectedItem = null;
      if (items[currentItem]) items[currentItem].classList.add('active');
    }
    function startLevelOne() {
      score = 0; timeLeft = 45; currentItem = 0;
      document.getElementById('score-value').textContent = score;
      document.getElementById('timer-value').textContent = timeLeft;
      feedback('sort-feedback', '', '');
      showItem();
      showScreen('sort');
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-value').textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerId);
          feedback('sort-feedback', 'Waktunya habis! Yuk coba lagi, Pahlawan Bumi!', 'bad');
          setTimeout(startLevelOne, 1500);
        }
      }, 1000);
    }
    function sortInto(category) {
      const item = items[currentItem];
      if (!item || timeLeft <= 0) return;
      if (item.dataset.category === category) {
        score += 25;
        document.getElementById('score-value').textContent = score;
        feedback('sort-feedback', 'Hebat! Sampah masuk ke tempat yang tepat! ⭐', 'good');
        currentItem++;
        setTimeout(() => {
          if (currentItem >= items.length) {
            clearInterval(timerId);
            showScreen('quiz');
          } else {
            feedback('sort-feedback', '', '');
            showItem();
          }
        }, 650);
      } else {
        feedback('sort-feedback', 'Ups, coba lihat warna tempat sampahnya lagi!', 'bad');
        item.classList.add('selected');
        setTimeout(() => item.classList.remove('selected'), 450);
      }
    }
    document.getElementById('start-button').addEventListener('click', startLevelOne);

    items.forEach(item => {
      item.addEventListener('dragstart', event => {
        selectedItem = item;
        event.dataTransfer.setData('text/plain', item.id);
      });
      item.addEventListener('click', () => {
        selectedItem = item;
        items.forEach(card => card.classList.remove('selected'));
        item.classList.add('selected');
        feedback('sort-feedback', 'Sekarang ketuk tempat sampah yang cocok!', 'good');
      });
      item.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          item.click();
        }
      });
    });
    bins.forEach(bin => {
      bin.addEventListener('dragover', event => { event.preventDefault(); bin.classList.add('drag-over'); });
      bin.addEventListener('dragleave', () => bin.classList.remove('drag-over'));
      bin.addEventListener('drop', event => {
        event.preventDefault();
        bin.classList.remove('drag-over');
        sortInto(bin.dataset.category);
      });
      bin.addEventListener('click', () => {
        if (selectedItem || items[currentItem]) sortInto(bin.dataset.category);
      });
    });

    document.querySelectorAll('.answer-btn').forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.correct === 'true') {
          button.classList.add('correct');
          feedback('quiz-feedback', 'Benar! Gelas plastik bisa menjadi tempat pensil yang keren! 🎉', 'good');
          launchConfetti();
          setTimeout(() => showScreen('reward'), 1050);
        } else {
          button.classList.add('wrong');
          feedback('quiz-feedback', 'Belum tepat. Pilih karya yang bisa dibuat dari gelas plastik!', 'bad');
          setTimeout(() => button.classList.remove('wrong'), 700);
        }
      });
    });

    function launchConfetti() {
      const layer = document.createElement('div');
      layer.className = 'confetti';
      const colors = ['#f26466', '#ffc94e', '#49bb78', '#63cbed', '#a777df'];
      for (let i = 0; i < 42; i++) {
        const piece = document.createElement('span');
        piece.className = 'piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * .55 + 's';
        piece.style.transform = 'rotate(' + Math.random() * 180 + 'deg)';
        layer.appendChild(piece);
      }
      document.body.appendChild(layer);
      setTimeout(() => layer.remove(), 3300);
    }
    function playCelebration() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, index) => {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = freq;
        gain.gain.setValueAtTime(.0001, ctx.currentTime + index * .13);
        gain.gain.exponentialRampToValueAtTime(.18, ctx.currentTime + index * .13 + .02);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + index * .13 + .18);
        oscillator.connect(gain).connect(ctx.destination);
        oscillator.start(ctx.currentTime + index * .13);
        oscillator.stop(ctx.currentTime + index * .13 + .2);
      });
    }
    document.getElementById('sound-button').addEventListener('click', playCelebration);
    document.getElementById('replay-button').addEventListener('click', () => {
      document.querySelectorAll('.answer-btn').forEach(button => button.classList.remove('correct', 'wrong'));
      feedback('quiz-feedback', '', '');
      showScreen('title');
    });
    lucide.createIcons();
  </script>
 </body>
